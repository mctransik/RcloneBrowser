name: Update

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Approved rclone build inputs: change only after reviewing a new upstream release.
# Both platforms must use exactly the same version and their own expected ZIP digest.
env:
  RCLONE_VERSION: v1.75.2
  RCLONE_WINDOWS_ZIP_SHA256: 8a9db2bad1dc79a65b3348fd857069598e2aab7cf4d118b77b1df23055aff818
  RCLONE_LINUX_ZIP_SHA256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702

# Least privilege: read-only unless a step needs more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use Python 3.14 to avoid aqtinstall's Python < 3.14 archive
      # misidentification (BadZipFile) seen in older versions.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Qt
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1, direct Node action (avoids broken $/action composite)
        with:
          # Exact version for reproducible builds. 6.10.3 is the newest Qt the
          # installer (aqtinstall 3.3) can read; 6.11+ metadata is not
          # supported by it yet.
          version: "6.10.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure, build and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1

      - name: Assemble app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content VERSION -First 1).Trim()
          $dir = "dist\RcloneBrowser"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build\build\RcloneBrowser.exe $dir

          # Qt plugins go into qt\plugins (found via qt.conf) instead of seven
          # folders next to the exe; plugin types the app does not use are
          # skipped. Qt and VC++ DLLs must stay next to the exe: Windows loads
          # them before any app code runs.
          windeployqt --release --no-translations --no-system-d3d-compiler `
                      --no-opengl-sw --no-compiler-runtime `
                      --skip-plugin-types styles,generic,networkinformation `
                      --plugindir "$dir\qt\plugins" "$dir\RcloneBrowser.exe"
          @(
            "[Paths]"
            "Plugins = qt/plugins"
          ) | Set-Content -Encoding ascii "$dir\qt.conf"

          # App-local VC++ runtime: the folder runs on a clean Windows install.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^\d' } | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $dir

          # GnuPG is required: unsigned checksums from the same server are NOT trusted.
          # windows-2025 includes Git for Windows; check its gpg.exe location.
          $gpgCandidates = @(
            (Get-Command gpg.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source),
            "$env:ProgramFiles\Git\usr\bin\gpg.exe",
            "C:\msys64\usr\bin\gpg.exe"
          )
          $gpg = $gpgCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $gpg) { throw "No GnuPG executable found; refusing unsigned rclone." }
          $env:GPG_BINARY = $gpg
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { throw "PGP verifier unit tests failed" }

          # Bundle official rclone after PGP SIGNATURE + SHA256 both pass.
          $tag = $env:RCLONE_VERSION
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid pinned rclone version" }
          $zip = "rclone-$tag-windows-amd64.zip"
          Invoke-WebRequest "https://downloads.rclone.org/$tag/$zip" -OutFile $zip
          Invoke-WebRequest "https://downloads.rclone.org/$tag/SHA256SUMS" -OutFile SHA256SUMS
          python scripts/verify_rclone_release.py --archive $zip --sums SHA256SUMS --key security/rclone-signing-key.asc --gpg $gpg
          if ($LASTEXITCODE -ne 0) { throw "rclone PGP verification failed. Aborting build." }
          $actualZipSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZipSha -ne $env:RCLONE_WINDOWS_ZIP_SHA256) {
            throw "Pinned Windows rclone ZIP SHA-256 does not match; refusing build."
          }
          Expand-Archive $zip -DestinationPath rclone-x
          New-Item -ItemType Directory -Force "$dir\rclone" | Out-Null
          Copy-Item (Get-ChildItem rclone-x -Recurse -Filter rclone.exe).FullName "$dir\rclone\"

          # Presence of RcloneBrowser.ini switches on portable mode. Paths are
          # relative to the exe, so the folder can live anywhere (USB stick...).
          @(
            "[Settings]"
            "rclone=rclone/rclone.exe"
            "checkRcloneUpdates=true"
          ) | Set-Content -Encoding ascii "$dir\RcloneBrowser.ini"

          # remote logos shipped by default (users can add or replace files)
          New-Item -ItemType Directory -Force "$dir\icons\remotes" | Out-Null
          Copy-Item icons\remotes\*.png "$dir\icons\remotes\"
          Copy-Item docs\remote-icons.md "$dir\icons\remotes\README.md"
          New-Item -ItemType Directory -Force "$dir\docs" | Out-Null
          Copy-Item README.md, LICENSE, CHANGELOG.md, docs\Rclone-Browser-Guide.pdf "$dir\docs\"

          # Build provenance is informational, not a malware verdict or signature.
          $sourceCommit = (git rev-parse HEAD).Trim()
          @(
            "source_commit=$sourceCommit"
            "github_run_id=$env:GITHUB_RUN_ID"
            "github_run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "rclone_version=$tag"
            "rclone_archive=$zip"
            "rclone_archive_sha256=$actualZipSha"
            "qt_version=6.10.3"
          ) | Set-Content -Encoding utf8 "$dir\docs\BUILD_PROVENANCE.txt"

          # Hash every payload file except the self-referential manifest.
          $root = (Resolve-Path -LiteralPath $dir).Path
          $hashLines = @(Get-ChildItem -LiteralPath $dir -Recurse -File |
            Sort-Object FullName | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $relative"
            })
          $hashLines | Set-Content -Encoding ascii "$dir\docs\PACKAGE_SHA256SUMS.txt"

          # Smoke test of the packaged folder: the app must start with this
          # layout (platform plugin via qt.conf, image formats, TLS).
          $p = Start-Process -FilePath "$dir\RcloneBrowser.exe" -ArgumentList "--selftest" `
                 -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive "$dir" "dist\RcloneBrowser-$ver-windows-x64.zip"
          "VERSION=$ver" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RcloneBrowser-${{ env.VERSION }}-windows-x64
          path: dist/RcloneBrowser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Qt
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1, direct Node action (avoids broken $/action composite)
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libgl1-mesa-dev libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 \
            libdbus-1-3 xvfb file gnupg

      - name: Configure, build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          ver=$(head -1 VERSION | tr -d '[:space:]')
          echo "VERSION=$ver" >> "$GITHUB_ENV"

          # AppImage tooling, pinned to releases and verified by checksum
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt" | sha256sum -c -
          mv linuxdeploy linuxdeploy-x86_64.AppImage
          mv linuxdeploy-plugin-qt linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # app files
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/metainfo \
                   AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/rclone-browser
          cp build/build/rclone-browser AppDir/usr/bin/
          cp packaging/linux/rclone-browser.desktop AppDir/usr/share/applications/
          cp packaging/linux/rclone-browser.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp packaging/linux/io.github.jackpison.RcloneBrowser.metainfo.xml AppDir/usr/share/metainfo/
          mkdir -p AppDir/usr/share/rclone-browser/icons/remotes
          cp icons/remotes/*.png AppDir/usr/share/rclone-browser/icons/remotes/

          # Never package an archive without upstream PGP signature verification.
          python3 -m unittest discover -s scripts/tests -v
          tag="$RCLONE_VERSION"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid pinned rclone version"; exit 1; }
          zip="rclone-$tag-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/$tag/$zip"
          curl -fsSLO "https://downloads.rclone.org/$tag/SHA256SUMS"
          python3 scripts/verify_rclone_release.py --archive "$zip" --sums SHA256SUMS --key security/rclone-signing-key.asc
          echo "$RCLONE_LINUX_ZIP_SHA256  $zip" | sha256sum -c -
          python3 -m zipfile -e "$zip" rclone-x
          install -m 755 "$(find rclone-x -name rclone -type f | head -1)" AppDir/usr/bin/rclone

          # Embed traceability in the AppImage (not an independent trust seal).
          printf 'source_commit=%s\ngithub_run_id=%s\ngithub_run_attempt=%s\nrclone_version=%s\nrclone_archive=%s\nrclone_archive_sha256=%s\nqt_version=6.10.3\n' \
            "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$tag" "$zip" "$RCLONE_LINUX_ZIP_SHA256" \
            > AppDir/usr/share/rclone-browser/BUILD_PROVENANCE.txt

          QMAKE="$QT_ROOT_DIR/bin/qmake" LINUXDEPLOY_OUTPUT_VERSION="$ver" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mkdir -p dist
          mv Rclone_Browser-*-x86_64.AppImage "dist/RcloneBrowser-$ver-linux-x86_64.AppImage"
          chmod +x dist/*.AppImage

          # smoke test of the finished AppImage on an X11 display
          xvfb-run -a "dist/RcloneBrowser-$ver-linux-x86_64.AppImage" --selftest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Release (disabled during security review)
    # FAIL CLOSED: no tag, dispatch, or PR may publish until the manual
    # release-approval and signing policy is implemented and reviewed.
    # Former condition: startsWith(github.ref, 'refs/tags/v')
    if: ${{ false }}
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # publish the release
      id-token: write # Sigstore identity for provenance
      attestations: write # publish provenance
      artifact-metadata: write # associate release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          set -euo pipefail
          ver=$(head -1 VERSION | tr -d '[:space:]')
          # A tagged release must target the intended version. Do not publish
          # another version accidentally or on a malformed tag.
          if [[ "$GITHUB_REF_NAME" != "v${ver}" &&
                "$GITHUB_REF_NAME" != "v${ver}-rc.1" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$ver"; exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          (cd dist && sha256sum *.zip *.AppImage > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 - "$ver" <<'PY'
          import re, sys
          ver = sys.argv[1]
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"(?ms)^## \[" + re.escape(ver) + r"\][^\n]*\n(.*?)(?=^## |\Z)", log)
          notes = m.group(1).strip() if m else "See CHANGELOG.md for details."
          notes += (
              "\n\n**Security RC1: Evaluation only. Test with a separate copy; do not use for production cloud data or backups.**\n\n"
              "\n\n---\n**Downloads**\n\n"
              f"- **Windows 10/11:** `RcloneBrowser-{ver}-windows-x64.zip`, extract anywhere and run `RcloneBrowser.exe`.\n"
              f"- **Linux (x86_64):** `RcloneBrowser-{ver}-linux-x86_64.AppImage`, make it executable (`chmod +x`) and run it.\n\n"
              "SHA-256 checksums are in `SHA256SUMS.txt`. Feedback and bug reports are welcome!"
          )
          open("dist/release-notes.md", "w", encoding="utf-8").write(notes)
          PY

      # Record provenance for the exact distributed archives on tag releases.
      - name: Attest release archives
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.AppImage

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Rclone Browser ${{ github.ref_name }} — security test build
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body_path: dist/release-notes.md
          files: |
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS.txt
